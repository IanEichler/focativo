# Nginx — reverse proxy para o Next.js (PM2 em 127.0.0.1:3000).
# Certificado via certbot: sudo certbot --nginx -d app.seudominio.com.br

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

upstream estoque_ia_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name app.seudominio.com.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name app.seudominio.com.br;

  # ssl_certificate / ssl_certificate_key gerenciados pelo certbot

  client_max_body_size 10m;
  proxy_read_timeout 60s;

  # Correlação de logs: reaproveita o id recebido ou gera um novo
  set $req_id $http_x_request_id;
  if ($req_id = "") { set $req_id $request_id; }

  # Proteção extra contra força bruta nas telas de autenticação
  location ~ ^/(login|cadastro|recuperar-senha)$ {
    limit_req zone=auth_limit burst=20 nodelay;
    include /etc/nginx/snippets/estoque-ia-proxy.conf;
  }

  location /_next/static/ {
    proxy_pass http://estoque_ia_web;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/snippets/estoque-ia-proxy.conf;
  }
}
